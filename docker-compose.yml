services:
  a1-client:
    image: a1-client:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a1-client
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.a1-client.rule=Host(`${TRAEFIK_HOST:-1lab.one}`)"
      - "traefik.http.routers.a1-client.entrypoints=websecure"
      - "traefik.http.routers.a1-client.service=a1-client"
      - "traefik.http.routers.a1-client.tls=true"
      - "traefik.http.routers.a1-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.a1-client.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
